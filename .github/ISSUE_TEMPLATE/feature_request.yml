name: Feature request / 功能建议
description: Suggest an improvement / 提出改进建议
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve? / 希望解决什么问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior / 期望的使用方式
    validations:
      required: true
