name: Bug report / 问题反馈
description: Report a reproducible problem / 反馈可以复现的问题
body:
  - type: markdown
    attributes:
      value: 请勿提供 API Key、Cookie、登录请求头或未脱敏的私人记录。Please remove credentials and private data from screenshots and logs.
  - type: input
    id: version
    attributes:
      label: Extension and Chrome versions / 扩展与 Chrome 版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期表现
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际表现
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Screenshots or sanitized logs / 截图或脱敏日志
